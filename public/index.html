<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerifiedBiz Engine — Master Business Platform</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --bg-primary: #ffffff; --bg-surface: #f8f9fa; --bg-card: #ffffff;
      --text-main: #1a1d20; --text-muted: #5f6368; --border-color: #cbd5e1;
      --border-thick: 2px solid #cbd5e1; --border-focus: #1a73e8;
      --radius-card: 12px; --radius-chip: 20px;
      --primary-accent: #1a73e8; --primary-hover: #1557b0;
      --success-accent: #16a34a; --warning-accent: #d97706; --error-accent: #dc2626;
      --shadow-subtle: 0 4px 12px rgba(0, 0, 0, 0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    body { background-color: var(--bg-surface); color: var(--text-main); line-height: 1.58; padding-bottom: 60px; -webkit-font-smoothing: antialiased; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: var(--bg-primary); border-bottom: var(--border-thick); position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-subtle); }
    .brand { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
    .brand span { color: var(--primary-accent); }
    .header-controls { display: flex; align-items: center; gap: 12px; }
    .user-profile-badge { display: none; align-items: center; gap: 8px; background: var(--bg-surface); border: var(--border-thick); padding: 4px 12px 4px 6px; border-radius: 20px; font-size: 13px; }
    .user-avatar { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border-color); }
    .live-ticker-container { background: #f0fdf4; border-bottom: 2px solid var(--success-accent); padding: 10px 24px; font-size: 13px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; color: var(--success-accent); }
    .live-indicator { display: flex; align-items: center; gap: 8px; }
    .pulse-dot { width: 10px; height: 10px; background-color: var(--success-accent); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(22, 163, 74, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); } }
    .search-section { max-width: 720px; margin: 24px auto 16px; padding: 0 20px; }
    .search-bar { position: relative; width: 100%; display: flex; align-items: center; background: var(--bg-primary); border: var(--border-thick); border-radius: 28px; padding: 0 18px; height: 52px; transition: 0.2s; box-shadow: var(--shadow-subtle); }
    .search-bar:focus-within { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15); }
    .search-icon { color: var(--text-muted); margin-right: 12px; font-size: 22px; }
    .search-input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-main); font-size: 16px; font-weight: 500; }
    .tabs-container { display: flex; gap: 10px; max-width: 720px; margin: 0 auto 8px; padding: 0 20px; overflow-x: auto; }
    .tab-chip { background: var(--bg-primary); border: var(--border-thick); color: var(--text-main); padding: 8px 18px; border-radius: var(--radius-chip); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
    .tab-chip.active, .tab-chip:hover { background: #eff6ff; border-color: var(--primary-accent); color: var(--primary-accent); }
    .catalog-note { max-width: 720px; margin: 0 auto 24px; padding: 0 20px; font-size: 12px; color: var(--text-muted); }
    .main-results { max-width: 720px; margin: 0 auto; padding: 0 20px; }
    .empty-state { text-align: center; padding: 48px 20px; background: var(--bg-card); border: var(--border-thick); border-radius: var(--radius-card); box-shadow: var(--shadow-subtle); }
    .empty-state span { font-size: 48px; color: var(--text-muted); margin-bottom: 12px; }
    .empty-state h3 { font-family: 'Outfit', sans-serif; font-size: 20px; color: var(--text-main); margin-bottom: 6px; }
    .empty-state p { font-size: 14px; color: var(--text-muted); }
    .result-card { background: var(--bg-card); border: var(--border-thick); border-radius: var(--radius-card); padding: 22px; margin-bottom: 20px; box-shadow: var(--shadow-subtle); transition: transform 0.15s ease; }
    .result-card:hover { transform: translateY(-2px); }
    .result-url { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .result-title { font-family: 'Outfit', sans-serif; font-size: 21px; color: var(--primary-accent); font-weight: 700; text-decoration: none; margin-bottom: 8px; display: block; }
    .result-snippet { font-size: 14px; color: var(--text-muted); margin-bottom: 16px; }
    .badge-status { display: inline-flex; align-items: center; gap: 6px; background: #eff6ff; border: 1.5px solid var(--primary-accent); color: var(--primary-accent); font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 6px; margin-bottom: 12px; }
    .action-row { display: flex; gap: 12px; margin-top: 16px; }
    .btn-action { background: var(--bg-surface); border: var(--border-thick); color: var(--text-main); padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; }
    .btn-action:hover { background: #e2e8f0; }
    .btn-action:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: var(--primary-accent); color: #ffffff; border-color: var(--primary-accent); }
    .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .btn-success { background: var(--success-accent); color: #ffffff; border-color: var(--success-accent); }
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; justify-content: flex-end; z-index: 200; }
    .drawer { background: var(--bg-primary); width: 100%; max-width: 520px; height: 100%; padding: 32px; border-left: var(--border-thick); overflow-y: auto; position: relative; box-shadow: -4px 0 20px rgba(0,0,0,0.1); }
    .drawer-close { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; }
    .form-input { width: 100%; background: var(--bg-primary); border: var(--border-thick); color: var(--text-main); padding: 12px 14px; border-radius: 8px; font-size: 15px; outline: none; transition: 0.2s; }
    .form-input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15); }
    .status-box { border-radius: 8px; font-size: 13px; margin-top: 16px; padding: 12px 16px; display: none; color: var(--text-main); }
    .status-box.ok { background: #f0fdf4; border: 1.5px solid var(--success-accent); }
    .status-box.err { background: #fef2f2; border: 1.5px solid var(--error-accent); }
  </style>
</head>
<body>

  <header>
    <div class="brand">VerifiedBiz <span>Engine</span></div>
    <div class="header-controls">
      <div id="userBadge" class="user-profile-badge">
        <img id="userPic" class="user-avatar" src="" alt="User">
        <span id="userName" style="font-weight: 700;"></span>
      </div>
      <div id="g_id_onload"
           data-client_id="181920475006-305lobieplldt1ethmb7rdbicnfkudnv.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_select="false"
           data-use_fedcm="false">
      </div>
      <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="outline" data-text="signin_with"></div>
    </div>
  </header>

  <div class="live-ticker-container">
    <div class="live-indicator"><span class="pulse-dot"></span> DISPATCH QUEUE</div>
    <div id="liveTickerText">Automated job routing via WhatsApp — connect to submit a request.</div>
  </div>

  <div class="search-section">
    <div class="search-bar">
      <span class="material-symbols-outlined search-icon">search</span>
      <input type="text" class="search-input" placeholder="Search service catalog..." id="searchInput" oninput="renderFeed()">
    </div>
  </div>

  <div class="tabs-container">
    <button class="tab-chip active" data-action="filter-category" data-payload="all">All Categories</button>
    <button class="tab-chip" data-action="filter-category" data-payload="trade">Skilled Trades</button>
    <button class="tab-chip" data-action="filter-category" data-payload="shipping">Logistics & Courier</button>
    <button class="tab-chip" data-action="filter-category" data-payload="digital">Digital & SaaS</button>
    <button class="tab-chip" data-action="filter-category" data-payload="pod">Print-On-Demand</button>
  </div>
  <div class="catalog-note">Service catalog — not a live provider count.</div>

  <div class="main-results" id="blueprintFeed"></div>

  <!-- Client Dispatch Drawer -->
  <div class="drawer-overlay" id="bookingDrawer" onclick="closeDrawer(event, 'bookingDrawer')">
    <div class="drawer">
      <button class="drawer-close" onclick="closeDrawer(true, 'bookingDrawer')"><span class="material-symbols-outlined">close</span></button>
      <h2 id="bookingTitle" style="color: var(--primary-accent); margin-bottom: 8px; font-family: 'Outfit';">Client Dispatch Engine</h2>
      <p id="bookingDesc" style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;"></p>

      <div class="form-group">
        <label>Client Name</label>
        <input type="text" id="clientName" class="form-input" placeholder="e.g. Samuel Adebayo">
      </div>
      <div class="form-group">
        <label>Dispatch Address / Target Location</label>
        <input type="text" id="clientAddress" class="form-input" placeholder="e.g. Commercial Ave, Victoria Island">
      </div>

      <div id="dispatchStatusBox" class="status-box">
        <strong>Status:</strong> <span id="dispatchText"></span>
      </div>

      <button style="width: 100%; margin-top: 24px;" class="btn-action btn-success" data-action="execute-dispatch" id="dispatchBtn">
        🚀 Confirm & Dispatch Now
      </button>
    </div>
  </div>

  <!-- Phone OTP Modal (now backed by real endpoints) -->
  <div id="phoneModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); align-items:center; justify-content:center; z-index:300;">
    <div style="background:#ffffff; border:var(--border-thick); padding:28px; border-radius:12px; max-width:400px; width:100%; box-shadow:0 10px 25px rgba(0,0,0,0.1);">
      <h3 style="color:var(--primary-accent); font-family:'Outfit'; margin-bottom:8px; font-size:20px;">Verify Your Phone</h3>
      <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">We'll send a real verification code via WhatsApp to link your number.</p>

      <div id="phoneInputStep">
        <input type="tel" id="userPhoneInput" class="form-input" placeholder="+234 800 000 0000" style="margin-bottom:12px;">
        <button data-action="send-otp" class="btn-action btn-primary" style="width:100%;" id="sendOtpBtn">Send Verification Code</button>
        <p id="otpSendError" style="color:var(--error-accent); font-size:12px; margin-top:8px; display:none;"></p>
      </div>

      <div id="otpInputStep" style="display:none;">
        <input type="text" id="otpCodeInput" class="form-input" placeholder="Enter 4-Digit Code" style="margin-bottom:12px; text-align:center; letter-spacing:6px; font-weight:bold;">
        <button data-action="confirm-otp" class="btn-action btn-success" style="width:100%;" id="confirmOtpBtn">Confirm & Lock Account</button>
        <p id="otpVerifyError" style="color:var(--error-accent); font-size:12px; margin-top:8px; display:none;"></p>
      </div>
    </div>
  </div>

<script>
const blueprints = [
  { id: "trade-1", category: "trade", url: "verifiedbiz.engine › trade › cctv", title: "Smart CCTV & Security Installation", badge: "Hands-On Trade", snippet: "Deploy IP security cameras and multi-device live surveillance feeds on-site." },
  { id: "trade-2", category: "trade", url: "verifiedbiz.engine › trade › plumbing", title: "Emergency Plumbing & Pipe Repairs", badge: "Hands-On Trade", snippet: "Rapid response leak detection, pipe clearing, and bathroom fixture repair." },
  { id: "trade-3", category: "trade", url: "verifiedbiz.engine › trade › electrical", title: "Residential & Commercial Electrician", badge: "Hands-On Trade", snippet: "Circuit breaker diagnostics, rewiring, and surge protection installations." },
  { id: "digital-1", category: "digital", url: "verifiedbiz.engine › digital › gmb-seo", title: "Google Maps & Local SEO Optimizer", badge: "Digital Asset", snippet: "Automated ranking updates, local citation syncing, and review request tools." },
  { id: "shipping-1", category: "shipping", url: "verifiedbiz.engine › courier › express", title: "Express Same-Day Parcel Delivery", badge: "Logistics Engine", snippet: "Instant pickup and direct-to-door delivery for urgent urban documents." },
  { id: "pod-1", category: "pod", url: "verifiedbiz.engine › store › custom-apparel", title: "Custom Streetwear & Graphic Apparel Store", badge: "Auto Fulfillment", snippet: "Automated heavy-cotton tees and hoodies printed and shipped via Podbase." }
];

let activeCategory = 'all';
let selectedServiceId = null;
let tempUserData = null;
let currentRequestId = null;

function renderFeed() {
  const feed = document.getElementById('blueprintFeed');
  const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
  feed.innerHTML = '';

  const filtered = blueprints.filter(bp => {
    const matchesCat = activeCategory === 'all' || bp.category === activeCategory;
    const matchesSearch = searchVal === '' ||
                          bp.title.toLowerCase().includes(searchVal) ||
                          bp.snippet.toLowerCase().includes(searchVal) ||
                          bp.category.toLowerCase().includes(searchVal);
    return matchesCat && matchesSearch;
  });

  if (filtered.length === 0) {
    feed.innerHTML = `
      <div class="empty-state">
        <span class="material-symbols-outlined">manage_search</span>
        <h3>No Matching Dispatches</h3>
        <p>No business engine matches "${searchVal}". Try another query or switch category tabs.</p>
      </div>
    `;
    return;
  }

  filtered.forEach(bp => {
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <div class="result-url">${bp.url}</div>
      <a href="#" class="result-title" data-action="open-booking" data-payload="${bp.id}">${bp.title}</a>
      <div class="badge-status"><span class="material-symbols-outlined" style="font-size:16px;">verified</span> ${bp.badge}</div>
      <p class="result-snippet">${bp.snippet}</p>
      <div class="action-row">
        <button class="btn-action btn-primary" data-action="open-booking" data-payload="${bp.id}">
          <span class="material-symbols-outlined" style="font-size:18px;">bolt</span> Access Engine
        </button>
      </div>
    `;
    feed.appendChild(card);
  });
}

const AppEngine = {
  init() {
    document.addEventListener('click', (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      event.preventDefault();
      const action = target.getAttribute('data-action');
      const payload = target.getAttribute('data-payload');
      this.dispatch(action, payload, target);
    });
    this.handleDeepLinking();
  },

  dispatch(action, payload) {
    switch (action) {
      case 'open-booking': this.openBooking(payload); break;
      case 'filter-category': this.filterCategory(payload, event.target); break;
      case 'send-otp': this.sendOTP(); break;
      case 'confirm-otp': this.confirmOTP(); break;
      case 'execute-dispatch': this.executeDispatch(); break;
    }
  },

  handleDeepLinking() {
    const hash = window.location.hash.replace('#', '');
    if (hash.startsWith('dispatch-')) {
      this.openBooking(hash.replace('dispatch-', ''));
    }
  },

  openBooking(id) {
    const bp = blueprints.find(b => b.id === id);
    if (!bp) return;
    selectedServiceId = id;
    currentRequestId = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);

    const account = JSON.parse(localStorage.getItem('userAccountRecord') || 'null');
    if (!account) {
      alert("Please authenticate via Google first!");
      google.accounts.id.prompt();
      return;
    }

    document.getElementById('clientName').value = account.fullName || '';
    document.getElementById('bookingTitle').innerText = `Dispatch: ${bp.title}`;
    document.getElementById('bookingDesc').innerText = bp.snippet;
    const box = document.getElementById('dispatchStatusBox');
    box.style.display = 'none';
    box.className = 'status-box';
    document.getElementById('bookingDrawer').style.display = 'flex';
    window.location.hash = `dispatch-${id}`;
  },

  filterCategory(cat, element) {
    activeCategory = cat;
    document.querySelectorAll('.tab-chip').forEach(el => el.classList.remove('active'));
    element.classList.add('active');
    renderFeed();
  },

  async sendOTP() {
    const phone = document.getElementById('userPhoneInput').value.trim();
    const errEl = document.getElementById('otpSendError');
    errEl.style.display = 'none';
    if (!phone) { errEl.textContent = 'Enter a valid phone number.'; errEl.style.display = 'block'; return; }

    const btn = document.getElementById('sendOtpBtn');
    btn.disabled = true; btn.textContent = 'Sending...';

    try {
      const res = await fetch('/api/send-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phoneNumber: phone })
      });
      const result = await res.json();

      if (!result.success) {
        errEl.textContent = result.error || 'Could not send code.';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Send Verification Code';
        return;
      }

      tempUserData.phoneNumber = phone;
      document.getElementById('phoneInputStep').style.display = 'none';
      document.getElementById('otpInputStep').style.display = 'block';
    } catch (err) {
      errEl.textContent = 'Network error — please try again.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Send Verification Code';
    }
  },

  async confirmOTP() {
    const code = document.getElementById('otpCodeInput').value.trim();
    const errEl = document.getElementById('otpVerifyError');
    errEl.style.display = 'none';

    const btn = document.getElementById('confirmOtpBtn');
    btn.disabled = true; btn.textContent = 'Verifying...';

    try {
      const res = await fetch('/api/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phoneNumber: tempUserData.phoneNumber,
          code,
          fullName: tempUserData.fullName,
          email: tempUserData.email
        })
      });
      const result = await res.json();

      if (!result.success) {
        errEl.textContent = result.error || 'Verification failed.';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Confirm & Lock Account';
        return;
      }

      localStorage.setItem('userAccountRecord', JSON.stringify(tempUserData));
      document.getElementById('phoneModal').style.display = 'none';
      location.reload();
    } catch (err) {
      errEl.textContent = 'Network error — please try again.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Confirm & Lock Account';
    }
  },

  async executeDispatch() {
    const name = document.getElementById('clientName').value;
    const address = document.getElementById('clientAddress').value;
    if (!name || !address) return alert("Enter Client Name and Address.");

    const box = document.getElementById('dispatchStatusBox');
    const text = document.getElementById('dispatchText');
    const btn = document.getElementById('dispatchBtn');
    box.style.display = 'block';
    box.className = 'status-box ok';
    text.innerHTML = `⚡ Logging to DB & sending WhatsApp alert...`;
    btn.disabled = true;

    try {
      const response = await fetch('/api/whatsapp-webhook', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          serviceId: selectedServiceId,
          clientName: name,
          dispatchAddress: address,
          requestId: currentRequestId
        })
      });
      const result = await response.json();

      if (result.success) {
        box.className = 'status-box ok';
        text.innerHTML = result.deduped
          ? `✅ Job #${result.jobId} already logged — no duplicate created.`
          : `✅ Job #${result.jobId} created & WhatsApp alert sent!`;
        return;
      } else {
        box.className = 'status-box err';
        text.innerHTML = `⚠️ Dispatch failed: ${result.error || 'unknown error'}. Nothing was sent.`;
        btn.disabled = false;
      }
    } catch (err) {
      box.className = 'status-box err';
      text.innerHTML = `⚠️ Could not reach the server. Nothing was sent — please try again.`;
      btn.disabled = false;
    }
  }
};

function parseJwt(token) {
  try {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
  } catch (e) { return null; }
}

function handleCredentialResponse(response) {
  const userData = parseJwt(response.credential);
  if (!userData) return;

  const existingRecord = JSON.parse(localStorage.getItem('userAccountRecord') || 'null');

  if (!existingRecord) {
    tempUserData = { fullName: userData.name, email: userData.email };
    document.getElementById('phoneModal').style.display = 'flex';
  } else {
    document.querySelector('.g_id_signin').style.display = 'none';
    document.getElementById('userPic').src = userData.picture;
    document.getElementById('userName').innerText = userData.given_name || userData.name;
    document.getElementById('userBadge').style.display = 'flex';
  }
}

function closeDrawer(e, drawerId) {
  if (e === true || e.target.id === drawerId) {
    document.getElementById(drawerId).style.display = 'none';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  renderFeed();
  AppEngine.init();
});
</script>
</body>
</html>
